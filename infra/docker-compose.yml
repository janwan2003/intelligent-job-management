services:
  postgres:
    image: postgres:18
    container_name: ijm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ijm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../data/pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ijm-api
    restart: unless-stopped
    environment:
      # Override with DATABASE_URL=...@host.docker.internal:5433/ijm when
      # using the tunnel deployment so the API + remote workers share the
      # same postgres on matemagician.  Default points at the local
      # ``postgres`` service for fully-local docker-compose dev runs.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ijm}
      HOST_ROOT: /host
      # HOST_PROJECT_ROOT must be the absolute host path of the project root.
      # docker run -v paths are resolved by the Docker daemon on the HOST, not
      # inside the API container.  ${PWD}/.. works when running from infra/.
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-${PWD}/..}
      EXECUTOR: docker
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8080}
      # 0=cost summary, 1=per step, 2=per-job analysis, 3=heuristic internals.
      # Forwarded verbatim to the optimizer's request body so the per-call
      # log file (/opt/code-optimizer/build/logs/log_<ts>.log inside the
      # ijm-optimizer container) gets the matching detail level.  Tail with
      # ./infra/follow_optimizer.sh.
      OPTIMIZER_VERBOSE: ${OPTIMIZER_VERBOSE:-2}
      # Local cost-benefit migration filter (off by default — turn on via
      # ``IJM_OPTIMIZER_GUARD_MIGRATIONS=1 docker compose up``).  Drops
      # GPUspb-proposed migrations whose claimed energy savings don't pay
      # for kill+drain+lost-epoch overhead.  Used to dampen oscillation
      # in cost-flat / slack-only regimes; not strictly required for
      # well-conditioned scenarios.  See the comment above the gate in
      # backend/src/optimizer.py for the math.
      IJM_OPTIMIZER_GUARD_MIGRATIONS: ${IJM_OPTIMIZER_GUARD_MIGRATIONS:-}
      NODES_CONFIG: ${NODES_CONFIG:-config/nodes_config.json}
    ports:
      - "${IJM_API_PORT:-8000}:8000"
    # Lets the API reach the host's SSH-tunneled worker ports via
    # ``host.docker.internal:8001/8002`` (referenced from the tunnel
    # ``nodes_config``).  Without this, ``localhost`` from inside the
    # container hits the container's own loopback, not the host's tunnels.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ../backend/src:/app/src
      - ../shared:/app/shared
      - ../config:/app/config:ro
      - ../data:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/host
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional worker service for multi-node simulation.
  # To activate: set "workerUrl": "http://worker:8001" in config/nodes_config.json
  # and add `--profile worker` to docker compose up.
  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: ijm-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ijm
      HOST_ROOT: /host
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-${PWD}/..}
      NODE_ID: local-worker
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/host
    deploy:
      resources:
        limits:
          memory: 256M

  worker2:
    profiles: [worker2]
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: ijm-worker2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ijm
      HOST_ROOT: /host
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-${PWD}/..}
      NODE_ID: local-worker2
    ports:
      - "8002:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/host
    deploy:
      resources:
        limits:
          memory: 256M

  optimizer:
    build:
      context: ../optimizer
    container_name: ijm-optimizer
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ijm-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M
