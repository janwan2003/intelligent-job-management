services:
  # No postgres — uses remote server's postgres via SSH tunnel (localhost:5433)
  # Requires tunnel to be open first: ./infra/tunnel.sh

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ijm-api
    restart: unless-stopped
    network_mode: host   # reach tunnel ports at localhost:5433 and localhost:8001
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ijm
      NODES_CONFIG: config/nodes_config.tunnel.json
      HOST_PROJECT_ROOT: /home/wangrat/ijm
      EXECUTOR: docker
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://localhost:8080}
    volumes:
      - ../backend/src:/app/src
      - ../config:/app/config:ro

  optimizer:
    build:
      context: ../optimizer
    container_name: ijm-optimizer
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ijm-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api
