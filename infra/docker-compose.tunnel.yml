services:
  # No postgres — uses remote server's postgres via SSH tunnel (localhost:5433).
  # Requires tunnel to be open first: `bash infra/tunnel.sh polimi` in another terminal.
  # Then: `docker compose -f infra/docker-compose.tunnel.yml up`.

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: ijm-api
    restart: unless-stopped
    network_mode: host   # reach tunnel ports at localhost:5433/8001/8002 and optimizer at localhost:8080
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ijm
      NODES_CONFIG: config/nodes_config.tunnel.json
      # Set by `infra/ijm up` (derived from IJM_REMOTE_USER). Fails loud when
      # this file is run by hand without it — export HOST_PROJECT_ROOT=/home/<user>/ijm.
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:?set by infra/ijm up (derived from IJM_REMOTE_USER)}
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://localhost:8080}
      OPTIMIZER_VERBOSE: ${OPTIMIZER_VERBOSE:-2}
      OPTIMIZER_METHOD: ${OPTIMIZER_METHOD:-RG}
    volumes:
      - ../backend/src:/app/src
      - ../shared:/app/shared:ro
      - ../config:/app/config:ro
    depends_on:
      - optimizer

  optimizer:
    build:
      context: ../optimizer
    container_name: ijm-optimizer
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ijm-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api
